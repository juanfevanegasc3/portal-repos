<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repositorios del curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Repositorios del curso</h1>
  <p id="sub"></p>
</header>
<div class="shell">
  <nav class="mods" id="mods" aria-label="Módulos"></nav>
  <main>
    <input class="search" id="q" type="search" placeholder="Buscar por nombre, descripción o lenguaje" aria-label="Buscar repositorios">
    <div id="list" aria-live="polite"></div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let D = { modules: [], repos: [] }, mod = "all", q = "";

const fmt = (d) => d ? new Date(d).toLocaleDateString("es", { month: "short", year: "numeric" }) : "";
const safeUrl = (u) => /^https?:\/\//.test(u) ? u : "#";

function row(r) {
  return `<article class="row">
    <div>
      <h3>${esc(r.name)}</h3>
      <p>${esc(r.description) || "Sin descripción."}</p>
      <div class="meta">
        ${r.language ? `<span><i class="dot"></i>${esc(r.language)}</span>` : ""}
        <span>${r.provider === "gitlab" ? "GitLab" : "GitHub"}</span>
        ${r.updated ? `<span>Actualizado ${fmt(r.updated)}</span>` : ""}
        ${r.stars ? `<span>${r.stars} estrellas</span>` : ""}
      </div>
    </div>
    <div class="acts">
      <button class="btn" data-clone="${esc(r.clone)}">Copiar git clone</button>
      <a class="btn primary" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Ver código</a>
    </div>
  </article>`;
}

function render() {
  const term = q.trim().toLowerCase();
  const repos = D.repos.filter((r) => !term || [r.name, r.description, r.language].join(" ").toLowerCase().includes(term));
  const known = new Set(D.modules.map((m) => m.id));
  const modOf = (r) => (known.has(r.module) ? r.module : "");
  const groups = [...D.modules.map((m) => ({ ...m })), { id: "", name: "Otros", description: "" }]
    .map((g) => ({ ...g, items: repos.filter((r) => modOf(r) === g.id) }))
    .filter((g) => g.items.length);

  $("#mods").innerHTML = [`<button data-m="all" aria-current="${mod === "all"}"><span>Todos</span><span>${D.repos.length}</span></button>`]
    .concat(D.modules.concat([{ id: "", name: "Otros" }]).map((m) => {
      const n = D.repos.filter((r) => modOf(r) === m.id).length;
      return n ? `<button data-m="${esc(m.id)}" aria-current="${mod === m.id}"><span>${esc(m.name)}</span><span>${n}</span></button>` : "";
    })).join("");

  const shown = groups.filter((g) => mod === "all" || g.id === mod);
  $("#list").innerHTML = shown.length
    ? shown.map((g) => `<section class="group"><h2>${esc(g.name)}</h2>${g.description ? `<p>${esc(g.description)}</p>` : ""}<div class="rows">${g.items.map(row).join("")}</div></section>`).join("")
    : `<p class="empty">No hay repositorios que coincidan con la búsqueda.</p>`;
}

document.addEventListener("click", async (e) => {
  const m = e.target.closest("[data-m]");
  if (m) { mod = m.dataset.m; render(); }
  const c = e.target.closest("[data-clone]");
  if (c) {
    await navigator.clipboard.writeText(`git clone ${c.dataset.clone}`);
    const t = c.textContent; c.textContent = "Copiado"; setTimeout(() => (c.textContent = t), 1500);
  }
});
$("#q").addEventListener("input", (e) => { q = e.target.value; render(); });

fetch("/api/repos").then((r) => r.json()).then((d) => {
  D = d;
  $("#title").textContent = d.site.title || "Repositorios del curso";
  document.title = $("#title").textContent;
  $("#sub").textContent = d.site.subtitle || "";
  render();
}).catch(() => { $("#list").innerHTML = `<p class="empty">No se pudieron cargar los repositorios. Recarga la página en unos minutos.</p>`; });
</script>
</body>
</html>
